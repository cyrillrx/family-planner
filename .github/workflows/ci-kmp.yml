name: KMP Client CI

on:
  pull_request:
    branches: [main]
    paths: ['cmp-app/**', '.github/workflows/ci-kmp.yml']
  push:
    branches: [main]
    paths: ['cmp-app/**', '.github/workflows/ci-kmp.yml']
  workflow_dispatch:

jobs:
  kmp-tests:
    name: CMP Client - JVM Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        working-directory: cmp-app
        run: chmod +x gradlew

      - name: Check formatting
        working-directory: cmp-app
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run JVM tests and generate Kover reports
        working-directory: cmp-app
        run: ./gradlew jvmTest koverXmlReportJvm --no-daemon

      - name: Upload Kover reports
        uses: actions/upload-artifact@v4
        with:
          name: kover-reports
          path: cmp-app/shared/*/build/reports/kover/reportJvm.xml

  sonar:
    name: CMP Client - SonarCloud
    runs-on: ubuntu-latest
    needs: kmp-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Sonar branch/PR analysis

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        working-directory: cmp-app
        run: chmod +x gradlew

      - name: Download Kover reports
        uses: actions/download-artifact@v4
        with:
          name: kover-reports
          # The upload globs cmp-app/shared/*/..., so the artifact is rooted at shared/.
          path: cmp-app/shared

      - name: SonarCloud analysis
        working-directory: cmp-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon --no-configuration-cache
