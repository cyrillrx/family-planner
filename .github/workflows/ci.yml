name: CI

on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'core/**', 'server/**', 'gradle/**', 'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradlew', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['app/**', 'core/**', 'server/**', 'gradle/**', 'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradlew', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check formatting
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run the tests and generate the Kover report
        run: ./gradlew jvmTest :server:test koverXmlReport --no-daemon

      - name: Upload the Kover report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/report.xml

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Sonar branch/PR analysis

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download the Kover report
        uses: actions/download-artifact@v4
        with:
          name: kover-report
          # One aggregated report, where every module's sonar block points.
          path: build/reports/kover

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon --no-configuration-cache
